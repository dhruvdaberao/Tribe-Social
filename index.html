  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Light Theme - Warm, Cozy, Mental-Health Friendly */
      --color-background: #FAF7F3;
      /* Warm Cream */
      --color-surface: #F2ECE6;
      /* Card Cream */
      --color-border: #E6DED6;
      /* Soft Divider */
      --color-primary: #2C211B;
      /* Deep Cocoa (Headings/Text) */
      --color-secondary: #8C7A6A;
      /* Muted Brown */
      --color-accent: #B89A7A;
      /* Brand Brown */
      --color-accent-hover: #9E8466;
      /* Darker Brand Brown */
      --color-accent-text: #FFFFFF;
      /* White on Brand */

      /* Soft Shadows */
      --shadow-sm: 0 2px 8px -2px rgba(44, 33, 27, 0.05);
      --shadow-md: 0 6px 20px -4px rgba(44, 33, 27, 0.08);
      /* Y: 6px, blur: 20px, opacity: 8% */
      --shadow-lg: 0 12px 30px -6px rgba(44, 33, 27, 0.1);

      --font-display: 'Satoshi', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    .dark {
      /* Dark Theme - Deep Cocoa, Soft, Safe */
      --color-background: #2C211B;
      /* Deep Cocoa */
      --color-surface: #3A2C25;
      /* Soft Cocoa */
      --color-border: #4A3A31;
      /* Subtle separation */
      --color-primary: #F5EFEA;
      /* Off-white */
      --color-secondary: #B8A99A;
      /* Muted Beige */
      --color-accent: #C9A27E;
      /* Warm Accent Brown */
      --color-accent-hover: #DBC0A5;
      /* Lighter hover */
      --color-accent-text: #2C211B;
      /* Dark text on accent */

      --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 6px 24px -4px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 32px -6px rgba(0, 0, 0, 0.4);
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    .animate-pop {
      animation: pop 0.3s ease-out;
    }

    body {
      background-color: var(--color-background);
      font-family: var(--font-body);
      color: var(--color-primary);
      overflow-x: hidden;
      /* Prevent horizontal scrolling */
    }

    .font-display {
      font-family: var(--font-display);
    }

    /* Improved UI/UX Transitions */
    button,
    a,
    input,
    textarea {
      transition: all 0.2s ease-in-out;
    }

    div[class*="bg-"]:not(.dark):not(:root),
    header,
    nav {
      transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
    }

    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--color-secondary);
      border-radius: 4px;
      border: 2px solid var(--color-background);
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: var(--color-secondary) transparent;
    }

    body {
      -ms-overflow-style: none;
    }

    /* Utility to hide scrollbar but keep it scrollable */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['var(--font-display)'],
            body: ['var(--font-body)'],
          },
          colors: {
            background: 'var(--color-background)',
            surface: 'var(--color-surface)',
            border: 'var(--color-border)',
            primary: 'var(--color-primary)',
            secondary: 'var(--color-secondary)',
            accent: 'var(--color-accent)',
            'accent-hover': 'var(--color-accent-hover)',
            'accent-text': 'var(--color-accent-text)',
          },
          boxShadow: {
            sm: 'var(--shadow-sm)',
            md: 'var(--shadow-md)',
            lg: 'var(--shadow-lg)',
          },
          animation: {
            pop: 'pop 0.3s ease-out',
          }
        }
      }
    }
  </script>

  <script>
      // Flicker-prevention script
      (function () {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
  </script>

</head>
