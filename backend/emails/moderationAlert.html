<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Report Alert</title>
</head>

<body
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #3B302B; background-color: #F8F5F2; margin: 0; padding: 20px;">
    <div
        style="max-width: 600px; margin: 0 auto; background: #FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <!-- Header -->
        <div style="background: #3B302B; padding: 24px; text-align: center;">
            <h1 style="color: #FFB088; margin: 0; font-size: 24px;">New Report Alert</h1>
        </div>

        <!-- Content -->
        <div style="padding: 32px;">
            <p style="font-size: 16px; margin-bottom: 24px;">Hello Admin,</p>

            <p style="margin-bottom: 24px;">A new report has been submitted that requires your attention.</p>

            <div
                style="background: #FFF5F0; border-left: 4px solid #FF8045; padding: 16px; margin-bottom: 24px; border-radius: 4px;">
                <p style="margin: 0 0 8px;"><strong>Target:</strong> {{targetType}} (ID: {{targetId}})</p>
                <p style="margin: 0 0 8px;"><strong>Reason:</strong> {{reason}}</p>
                <p style="margin: 0;"><strong>Details:</strong> {{details}}</p>
            </div>

            <p style="margin-bottom: 8px;">Reported by: <strong>{{reporterName}}</strong></p>
            <p style="color: #666; font-size: 14px; margin-top: 0;">Time: {{time}}</p>

            <div style="text-align: center; margin-top: 32px;">
                <a href="{{adminUrl}}"
                    style="display: inline-block; background: #FF8045; color: #FFFFFF; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600;">Review
                    in Admin Panel</a>
            </div>
        </div>

        <!-- Footer -->
        <div
            style="background: #F8F5F2; padding: 24px; text-align: center; font-size: 14px; color: #8A7B74; border-top: 1px solid #E5E5E5;">
            <p style="margin: 0;">Tribe Social Moderation Team</p>
        </div>
    </div>
</body>

</html>
