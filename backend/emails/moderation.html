<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moderation Update</title>
  </head>
  <body style="margin:0; padding:0; background:#f6f4f2; font-family: Arial, sans-serif; color:#2f2a26;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:520px; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e6e1dd;">
            <tr>
              <td style="padding:24px 28px; background:#221d1a; color:#ffffff;">
                <h1 style="margin:0; font-size:20px;">Tribe Social</h1>
                <p style="margin:8px 0 0; font-size:14px; color:#d1c5bd;">Moderation update</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 12px; font-size:16px;">Hi {{userName}},</p>
                <p style="margin:0 0 16px; font-size:14px; line-height:1.6;">
                  {{moderationMessage}}
                </p>
                <p style="margin:0; font-size:13px; color:#8a7b74;">
                  If you believe this is a mistake, please contact support.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
